name: Security without native builds
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '29 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  security:
    uses: RedSalamanders/.github/.github/workflows/security.yml@d6a33c5b8aa009e04653704c648d7ad87be94fcc
    with:
      engine_ref: d6a33c5b8aa009e04653704c648d7ad87be94fcc
