name: Security without native builds
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '29 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  security:
    uses: RedSalamanders/.github/.github/workflows/security.yml@195ab4a253947f4217ca1e57d37ba5e43ae1cb0c
    with:
      engine_ref: 195ab4a253947f4217ca1e57d37ba5e43ae1cb0c
