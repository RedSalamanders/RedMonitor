name: Security without native builds
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '29 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  security:
    uses: RedSalamanders/.github/.github/workflows/security.yml@8c53b33aa1bce7fa096d7a43f02270df7700dad8
    with:
      engine_ref: 8c53b33aa1bce7fa096d7a43f02270df7700dad8
