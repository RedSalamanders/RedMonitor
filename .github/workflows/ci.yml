name: Standalone validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: redmonitor-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tooling:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          # This commit and its first parent: the changelog check compares the change with HEAD^1.
          fetch-depth: 2
      - name: Changelog changes are fragments or exact folds
        run: ./Tools/Test-Changelog.ps1 -Base HEAD^1
        shell: pwsh
      - run: ./validate.ps1
        shell: pwsh
      - name: Install checksum-pinned formatter
        run: ./Tools/Install-ClangFormat.ps1
        shell: pwsh
      - run: ./format.ps1 -Check
        shell: pwsh
      - run: ./Tests/Tooling.Tests.ps1
        shell: pwsh
  native:
    name: native (${{ matrix.platform }}, ${{ matrix.configuration }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
        configuration: [Debug, Release, ASan Debug]
        include:
          - platform: x64
            runner: windows-2025-vs2026
          - platform: ARM64
            runner: windows-11-vs2026-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: ./test.ps1 -Platform ${{ matrix.platform }} -Configuration "${{ matrix.configuration }}"
        shell: pwsh
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-${{ matrix.platform }}-${{ matrix.configuration }}
          include-hidden-files: true
          path: |
            .build/logs/**
            .build/test-runs/**
            .build/${{ matrix.platform }}/${{ matrix.configuration }}/*.log
            .build/${{ matrix.platform }}/${{ matrix.configuration }}/*receipt.json
          retention-days: 14
