name: Standalone validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: redmonitor-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tooling:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          # A pull request needs its merge commit and first parent; a push needs the history back to the tip it replaced. The
          # strings matter: a bare 0 is falsy, so "push && 0 || 2" would give every push a two-commit checkout.
          fetch-depth: ${{ github.event_name == 'push' && '0' || '2' }}
      - name: Changelog changes are fragments or exact folds
        env:
          # A pull request's merge commit compares with its first parent; a push compares with the tip it replaced.
          CHANGELOG_BASE: ${{ github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before || 'HEAD^1' }}
        run: ./Tools/Test-Changelog.ps1 -Base $env:CHANGELOG_BASE
        shell: pwsh
      - run: ./validate.ps1
        shell: pwsh
      - name: Install checksum-pinned formatter
        run: ./Tools/Install-ClangFormat.ps1
        shell: pwsh
      - run: ./format.ps1 -Check
        shell: pwsh
      - run: ./Tests/Tooling.Tests.ps1
        shell: pwsh
  native:
    name: native (${{ matrix.platform }}, ${{ matrix.configuration }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
        configuration: [Debug, Release, ASan Debug]
        include:
          - platform: x64
            runner: windows-2025-vs2026
          - platform: ARM64
            runner: windows-11-vs2026-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: ./test.ps1 -Platform ${{ matrix.platform }} -Configuration "${{ matrix.configuration }}"
        shell: pwsh
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-${{ matrix.platform }}-${{ matrix.configuration }}
          include-hidden-files: true
          path: |
            .build/logs/**
            .build/test-runs/**
            .build/${{ matrix.platform }}/${{ matrix.configuration }}/*.log
            .build/${{ matrix.platform }}/${{ matrix.configuration }}/*receipt.json
          retention-days: 14
