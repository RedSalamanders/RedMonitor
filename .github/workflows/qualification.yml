name: Manual extended qualification
on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Diagnostic profile; does not publish or advance Release qualification
        type: choice
        options: [Debug, ASan Debug, Release]
        default: Debug
      scope:
        description: Normal regression or explicit Full qualification
        type: choice
        options: [Normal, Full]
        default: Normal
      platform:
        description: Native execution architecture; All keeps the complete diagnostic matrix
        type: choice
        options: [All, x64, ARM64]
        default: All
permissions:
  contents: read
concurrency:
  group: explicit-qualification-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  qualification:
    if: github.ref == 'refs/heads/main'
    uses: RedSalamanders/.github/.github/workflows/qualification.yml@318eaebe1aca58536d2c91972ea24f9479505440
    with:
      engine_ref: 318eaebe1aca58536d2c91972ea24f9479505440
      configuration: ${{ inputs.configuration }}
      scope: ${{ inputs.scope }}
      platform: ${{ inputs.platform }}
