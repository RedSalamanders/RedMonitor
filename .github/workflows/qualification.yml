name: Manual extended qualification
on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Diagnostic profile; does not publish or advance Release qualification
        type: choice
        options: [Debug, ASan Debug, Release]
        default: Debug
      scope:
        description: Normal regression or explicit Full qualification
        type: choice
        options: [Normal, Full]
        default: Normal
permissions:
  contents: read
concurrency:
  group: explicit-qualification-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  qualification:
    if: github.ref == 'refs/heads/main'
    uses: RedSalamanders/.github/.github/workflows/qualification.yml@91c38d667a0b1776e74dc43403f08a844fa9aade
    with:
      engine_ref: 91c38d667a0b1776e74dc43403f08a844fa9aade
      configuration: ${{ inputs.configuration }}
      scope: ${{ inputs.scope }}
