name: Publish qualified ZIPs
on:
  workflow_dispatch:
    inputs:
      qualification_run:
        description: Original successful Qualify main Release run ID; retained ZIPs only
        type: string
        required: true
      operation:
        description: Prepare previews; Release publishes ZIPs; Winget verifies both native installs then submits
        type: choice
        options: [Prepare, Release, Winget]
        default: Prepare
permissions:
  contents: write
  actions: read
concurrency:
  group: explicit-publication
  cancel-in-progress: false
  queue: max
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    uses: RedSalamanders/.github/.github/workflows/publish.yml@91c38d667a0b1776e74dc43403f08a844fa9aade
    with:
      engine_ref: 91c38d667a0b1776e74dc43403f08a844fa9aade
      qualification_run: ${{ inputs.qualification_run }}
      operation: ${{ inputs.operation }}
    secrets:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
